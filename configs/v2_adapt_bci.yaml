# Site-Adaptive HER2 Calibration on BCI (stages 1, 3, 4). Starts from Run A
# (never saw BCI), adapts with BCI TRAIN images whose labels are stripped,
# scores BCI TEST once. Hyperparameters fixed here before any run.
base: v2_base.yaml
run_name: adapt_bci
adapt:
  checkpoint: artifacts/v2/run_a/best.pt
  bn_alpha: 1.0          # full re-estimation on the target site
  bn_max_bags: 600
self_train:
  steps: 1500
  lr: 3.0e-5
  weight_decay: 1.0e-4
  threshold: 0.7         # teacher confidence needed for a pseudo-label (after alignment)
  ema: 0.999
  unsup_weight: 1.0
  ordinal_weight: 0.2
  prior: null            # uniform: the label-free, neutral choice (BCI's true mix is unknown to the method)
  source_bags: 2
  target_bags: 4
  workers: 6
  log_every: 50
