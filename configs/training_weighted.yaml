# BioMarkHER2 -- Phase 2, experiment: inverse-frequency class weights.
#
# A controlled comparison against configs/training.yaml. EVERY value below is
# identical to that file except `loss.class_weights` and `output_dir`. Keep it
# that way: if anything else drifts, the two runs stop being comparable and the
# experiment answers nothing.
#
# The question it answers, decided before the run rather than after:
#
#   The 40x run learned weak (1+) (IoU 0.341) but never predicts moderate (2+)
#   (IoU 0.0001, 253 pixels out of 21 million). Two causes are possible --
#   class rarity, or a resolution limit at the decode head's H/4. This run
#   tests rarity.
#
#     moderate IoU moves meaningfully off zero -> rarity was the cause.
#     moderate IoU stays ~0                    -> rarity was NOT the cause;
#                                                 the next experiment is
#                                                 supervising at H/4, and this
#                                                 option gets dropped rather
#                                                 than kept as decoration.

split:
  holdout_by: filename_origin
  holdout_value: test
  val_fraction: 0.15
  stratify: true
  seed: 20260805
  require_all_classes: true

model:
  checkpoint: nvidia/segformer-b0-finetuned-ade-512-512
  num_classes: 5
  image_size: 512
  pretrained: true

loss:
  cross_entropy_weight: 1.0
  dice_weight: 0.5
  # The only substantive change. "auto" = weights proportional to 1/frequency,
  # normalised to mean 1, counted over every fit tile (not a sample) and
  # written back into resolved_config.yaml so the run is reproducible from its
  # own artifact. On the 40x fit balance this comes out to roughly
  #   background 0.26  negative 0.18  weak 1.23  moderate 2.35  strong 0.99
  # -- a 2.4x relative cost on moderate versus strong. Mild enough that the
  # instability inverse-frequency weighting can cause on very skewed data is
  # unlikely here; training/losses.py has that warning in full.
  class_weights: auto
  ignore_index: -100
  label_smoothing: 0.0
  dice_smooth: 1.0

optim:
  learning_rate: 6.0e-5
  weight_decay: 0.01
  epochs: 4
  batch_size: 2
  grad_accum_steps: 4
  warmup_fraction: 0.05
  max_grad_norm: 1.0
  num_workers: 0

data:
  patch_root: data/raw
  cache_root: data/cache/pseudo_labels_40x
  max_fit_patches: 200
  max_val_patches: 30
  max_holdout_patches: 200
  augment: true

output_dir: artifacts/phase2_40x_weighted
seed: 20260805
