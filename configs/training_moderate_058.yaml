# Threshold-sensitivity variant -- routes the pseudo-label cache and output
# dir to a spot of its own so it never collides with the baseline
# (configs/training.yaml) or the other threshold variants. Pair with
# configs/preprocessing_moderate_058.yaml. See
# tasks/person1_model_quality.md Task 2.

split:
  holdout_by: filename_origin
  holdout_value: test
  val_fraction: 0.15
  stratify: true
  seed: 20260805
  require_all_classes: true

model:
  architecture: unet
  num_classes: 5
  image_size: 512
  pretrained: true
  in_channels: 4

loss:
  cross_entropy_weight: 1.0
  dice_weight: 0.5
  focal_weight: 1.0
  focal_gamma: 2.0
  class_weights: null
  ignore_index: -100
  label_smoothing: 0.0
  dice_smooth: 1.0

optim:
  learning_rate: 1.0e-4
  weight_decay: 0.01
  epochs: 4
  batch_size: 2
  grad_accum_steps: 4
  warmup_fraction: 0.05
  max_grad_norm: 1.0
  num_workers: 0

data:
  patch_root: data/raw
  # The _orig subset, not the full 10,543-tile variant cache: training samples
  # its 200 patches from whatever is on disk, and the full cache would draw a
  # different sample than the baseline did. This is the same 898 patches the
  # baseline pool has, so fit/val are the baseline's 792/119 tiles with only the
  # labels differing (scripts/subset_pseudo_label_cache.py).
  cache_root: data/cache/pseudo_labels_40x_moderate_058_orig
  max_fit_patches: 200
  max_val_patches: 30
  max_holdout_patches: 200
  augment: true

output_dir: artifacts/phase2_unet_moderate_058
seed: 20260805
