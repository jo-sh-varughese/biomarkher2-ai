# Invasive-tumour segmenter (wsi/tumour.py), trained on TIGER H&E ROIs.
# Settings fixed before training; see scripts/train_tumour.py for the protocol.
tiger_root: data/external/tiger/tissue-cells
her2_root: data/raw
bci_root: data/external/bci_full/IHC
output_dir: artifacts/tumour
seed: 20261002
val_fraction: 0.15
encoder: resnet50
encoder_weights: lunit_bt
crop: 512
batch: 8
workers: 6
samples_per_epoch: 2400
epochs: 25
lr: 3.0e-4
class_weights: [1.0, 1.0, 1.5, 1.5]   # other, invasive, in-situ, glands (the last two are rarer)
max_minutes: 60
