# BioMarkHER2 -- ResNet18-UNet with inverse-frequency class loss weighting.
#
# Identical to configs/training.yaml in every other respect -- the comparison
# against artifacts/phase2_unet has to be controlled, so only loss.class_weights
# and output_dir differ. See tasks/person1_model_quality.md Task 1 and
# PHASE5_CLASS_WEIGHTS.md for what this run is for and what happened.

split:
  holdout_by: filename_origin
  holdout_value: test
  val_fraction: 0.15
  stratify: true
  seed: 20260805
  require_all_classes: true

model:
  architecture: unet
  num_classes: 5
  image_size: 512
  pretrained: true
  in_channels: 4

loss:
  cross_entropy_weight: 1.0
  dice_weight: 0.5
  focal_weight: 1.0
  focal_gamma: 2.0
  class_weights: auto        # the one change: inverse-frequency over all fit tiles
  ignore_index: -100
  label_smoothing: 0.0
  dice_smooth: 1.0

optim:
  learning_rate: 1.0e-4
  weight_decay: 0.01
  epochs: 4
  batch_size: 2
  grad_accum_steps: 4
  warmup_fraction: 0.05
  max_grad_norm: 1.0
  num_workers: 0

data:
  patch_root: data/raw
  cache_root: data/cache/pseudo_labels_40x
  max_fit_patches: 200
  max_val_patches: 30
  max_holdout_patches: 200
  augment: true

output_dir: artifacts/phase2_unet_weighted   # the other change
seed: 20260805
