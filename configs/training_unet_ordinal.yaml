# BioMarkHER2 -- ResNet18-UNet with an auxiliary ordinal-distance loss term.
#
# Identical to configs/training.yaml (the baseline, NOT the rejected
# class-weighted variant -- see PHASE5_CLASS_WEIGHTS.md) in every other
# respect, so this isolates exactly one change: loss.ordinal_weight. See
# training/losses.py:ordinal_distance_loss and PHASE5_ORDINAL.md for what
# this is and why it was tried.

split:
  holdout_by: filename_origin
  holdout_value: test
  val_fraction: 0.15
  stratify: true
  seed: 20260805
  require_all_classes: true

model:
  architecture: unet
  num_classes: 5
  image_size: 512
  pretrained: true
  in_channels: 4

loss:
  cross_entropy_weight: 1.0
  dice_weight: 0.5
  focal_weight: 1.0
  focal_gamma: 2.0
  class_weights: null        # the rejected lever (PHASE5_CLASS_WEIGHTS.md) -- off
  ordinal_weight: 0.3        # the one change under test
  ignore_index: -100
  label_smoothing: 0.0
  dice_smooth: 1.0

optim:
  learning_rate: 1.0e-4
  weight_decay: 0.01
  epochs: 4
  batch_size: 2
  grad_accum_steps: 4
  warmup_fraction: 0.05
  max_grad_norm: 1.0
  num_workers: 0

data:
  patch_root: data/raw
  cache_root: data/cache/pseudo_labels_40x
  max_fit_patches: 200
  max_val_patches: 30
  max_holdout_patches: 200
  augment: true

output_dir: artifacts/phase2_unet_ordinal   # the other change
seed: 20260805
