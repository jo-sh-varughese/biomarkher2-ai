<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Kept in step with the toggle by ThemeProvider, so the phone's address
         bar matches the page rather than staying light behind a dark UI. -->
    <meta name="theme-color" content="#f5f6fb" />

    <!-- Stamp the theme before the first paint. The portal defaults to light
         regardless of the operating system's preference, so on a phone set to
         dark mode the page would otherwise paint dark for one frame and then
         flip. This has to run inline and synchronously in the head: any
         deferred or bundled script is already too late. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("bmh2.theme.v1");
          document.documentElement.setAttribute(
            "data-theme",
            stored === "dark" ? "dark" : "light"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <title>BioMarkHER2 — HER2 IHC Review Portal</title>
    <meta
      name="description"
      content="HER2 IHC pre-scoring measurement aid. Measures stained tissue area and shows where the staining is, so a pathologist can score faster and more consistently."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Anek+Malayalam:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <!-- Language, like the theme, is applied before the first paint so the
         correct font is requested immediately instead of after a reflow. -->
    <script>
      (function () {
        try {
          var lang = localStorage.getItem("bmh2.lang.v1");
          document.documentElement.setAttribute("lang", lang === "ml" ? "ml" : "en");
        } catch (e) {
          document.documentElement.setAttribute("lang", "en");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
