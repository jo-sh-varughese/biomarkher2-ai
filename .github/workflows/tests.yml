name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # torch/torchvision are deliberately not in requirements.txt --
          # installed from the CPU wheel index, same two-step install
          # CONTRIBUTING.md documents, because this project runs CPU-only by
          # design (see PROJECT_PLAN.md). torchvision provides the ResNet18
          # encoder models/unet_seg.py imports (adopted in Phase 5) -- omitting
          # it here made every test that imports models/ fail collection with
          # ModuleNotFoundError, passing locally only because a dev .venv had
          # it installed by hand.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: pytest -q
