# Binds the portal to 127.0.0.1 on the HOST only. Everyone signs in with
# their own account (the first run prints a one-time setup link in
# `docker compose logs`). To serve other machines, put an HTTPS reverse proxy
# in front, then change the port mapping and turn on the two settings under
# `environment` -- see docs/ACCOUNTS_AND_ADMIN.md.
services:
  biomarkher2:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Read-only: the viewer only ever reads sample patches from here.
      - ./data:/app/data:ro
      # Read-write: checkpoints are read, artifacts/reviews.jsonl is
      # appended to every time a pathologist records a review, and the
      # account database (artifacts/biomark.db) lives here too -- so accounts
      # survive rebuilds. Back this directory up.
      - ./artifacts:/app/artifacts
    environment:
      # Behind an HTTPS reverse proxy, turn both on:
      # BIOMARK_SECURE_COOKIES: "1"   # session cookie marked Secure, HSTS sent
      # BIOMARK_TRUST_PROXY: "1"      # audit log records the client's address
      BIOMARK_DB: artifacts/biomark.db
    restart: unless-stopped
    command: ["--run", "artifacts/phase2_unet_8epochs", "--patch-root", "data/raw",
              "--prescore-run", "artifacts/v2/run_b/best.pt",
              "--slide-root", "data/slides",
              # Name the hospital this server analyses for. A site other than the
              # validated training site starts with the AI pre-score WITHHELD
              # (shadow mode) until a local validation record is added -- see
              # docs/DEPLOYMENT.md, "Site validation".
              "--site-name", "${BIOMARK_SITE_NAME:-HER2-IHC-40x (training site, UMMC)}"]
